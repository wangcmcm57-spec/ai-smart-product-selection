<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>上海试点 AI 新品推荐工作台 - 新品雷达 Demo</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #eff4f2;
      --surface: #ffffff;
      --surface-soft: #f7faf9;
      --surface-warm: #fffdf8;
      --surface-tint: #e9f5f0;
      --ink: #12201f;
      --text: #334340;
      --muted: #66766f;
      --subtle: #8a9994;
      --line: #d8e3df;
      --line-soft: #e7efeb;
      --teal: #14786f;
      --teal-deep: #083f3b;
      --teal-soft: #ddf0eb;
      --mint: #bdded5;
      --blue: #2f65b7;
      --blue-soft: #edf4ff;
      --orange: #b96918;
      --orange-soft: #fff2de;
      --red: #a64238;
      --red-soft: #fff0ed;
      --green: #2f8356;
      --green-soft: #e7f5ec;
      --plum: #6652a3;
      --berry: #9c3545;
      --shadow: 0 18px 38px rgba(26, 45, 43, 0.09), 0 2px 8px rgba(26, 45, 43, 0.04);
      --shadow-sm: 0 8px 22px rgba(26, 45, 43, 0.06);
      --radius: 8px;
      --ease: cubic-bezier(.2, .8, .2, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background:
        linear-gradient(180deg, #f8faf7 0, var(--bg) 34%, #edf3f1 100%);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    ::selection {
      background: #cde9e1;
      color: var(--teal-deep);
    }

    :focus-visible {
      outline: 3px solid rgba(15, 118, 110, .22);
      outline-offset: 2px;
    }

    .app-shell {
      height: 100vh;
      min-height: 100vh;
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(255, 255, 255, .92);
      border-bottom: 1px solid var(--line-soft);
      backdrop-filter: blur(18px);
      position: relative;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 260px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background:
        linear-gradient(145deg, #0d625c 0%, var(--teal-deep) 100%);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: 0 8px 20px rgba(8, 63, 59, .22);
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-title strong {
      font-size: 14px;
      line-height: 1.1;
    }

    .brand-title span {
      font-size: 12px;
      color: var(--muted);
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 100%;
      color: var(--muted);
    }

    .top-nav button {
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      transition: background .18s var(--ease), color .18s var(--ease);
    }

    .top-nav button:hover,
    .top-nav button.active {
      background: #edf7f3;
      color: var(--teal-deep);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 260px;
      justify-content: flex-end;
      color: var(--muted);
    }

    .icon-button {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--muted);
      transition: background .18s var(--ease), color .18s var(--ease);
    }

    .icon-button:hover {
      background: var(--surface-tint);
      color: var(--teal-deep);
    }

    .icon-button svg,
    .btn svg,
    .filter-label svg,
    .chip svg,
    .feedback-button svg {
      width: 16px;
      height: 16px;
      stroke-width: 2;
    }

    .user-pill {
      height: 34px;
      border: 1px solid #d5e4de;
      border-radius: 8px;
      padding: 0 10px 0 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      background: #fcfffe;
    }

    .user-pill span:not(.avatar) {
      white-space: nowrap;
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--teal-soft);
      color: var(--teal-deep);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
    }

    .page {
      min-width: 1180px;
      min-height: 0;
      height: calc(100vh - 56px);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 12px;
      padding: 16px 22px 22px;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 12px 16px;
      border-radius: 10px;
      background:
        linear-gradient(135deg, #083f3b 0%, #126a62 72%, #c47a24 168%);
      box-shadow: 0 16px 32px rgba(8, 63, 59, .16);
    }

    .title-block h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0;
      color: #ffffff;
    }

    .title-block p {
      margin: 6px 0 0;
      color: rgba(236, 250, 245, .82);
      font-size: 13px;
    }

    .head-side {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .chip {
      height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .2);
      background: rgba(255, 255, 255, .12);
      color: rgba(244, 252, 249, .9);
      white-space: nowrap;
      font-size: 12px;
    }

    .chip.good {
      color: #ffffff;
      background: rgba(255, 255, 255, .16);
      border-color: rgba(255, 255, 255, .28);
    }

    .filter-panel {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .98) 0%, rgba(250, 253, 251, .98) 100%);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 10px 12px;
      display: grid;
      gap: 8px;
    }

    .filters {
      display: grid;
      grid-template-columns: 148px 132px 152px 168px minmax(150px, 1fr) 112px 112px;
      gap: 10px;
      align-items: end;
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .filter-label {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .required {
      color: var(--orange);
      font-weight: 700;
    }

    .select-wrap {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdfc;
      position: relative;
      transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
    }

    .select-wrap:hover,
    .select-wrap:focus-within {
      border-color: #aacfc8;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(20, 120, 111, .09);
    }

    select {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      padding: 0 32px 0 10px;
      appearance: none;
    }

    .select-wrap::after {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      transform: rotate(45deg);
      position: absolute;
      right: 13px;
      top: 12px;
      pointer-events: none;
    }

    .btn {
      height: 36px;
      border-radius: 8px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      transition: transform .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease);
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: #bfd4cf;
      box-shadow: 0 8px 16px rgba(25, 42, 48, .08);
    }

    .btn.primary {
      border-color: var(--teal);
      background:
        linear-gradient(180deg, #1a857a 0%, var(--teal) 100%);
      color: #fff;
      box-shadow: 0 12px 22px rgba(20, 120, 111, .18);
    }

    .btn.primary:hover {
      background: var(--teal-deep);
      border-color: var(--teal-deep);
    }

    .filter-note {
      min-height: 22px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
    }

    .filter-note.error {
      color: var(--red);
    }

    .workbench {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: 410px minmax(0, 1fr);
      gap: 14px;
    }

    .queue-panel,
    .detail-panel,
    .assistant-panel {
      background: rgba(255, 255, 255, .98);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .queue-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 14px 11px;
      border-bottom: 1px solid var(--line-soft);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 760;
    }

    .panel-head span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .queue-list {
      min-height: 0;
      overflow: auto;
      padding: 12px;
      scrollbar-width: thin;
      scrollbar-color: #b8c9c8 transparent;
    }

    .queue-list::-webkit-scrollbar,
    .detail-panel::-webkit-scrollbar {
      width: 10px;
    }

    .queue-list::-webkit-scrollbar-thumb,
    .detail-panel::-webkit-scrollbar-thumb {
      background: #b8c9c8;
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: padding-box;
    }

    .queue-card {
      width: 100%;
      min-height: 146px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #e1ebe7;
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, #ffffff 0%, #fbfdfb 100%);
      text-align: left;
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 12px;
      transition: transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
      position: relative;
      cursor: pointer;
    }

    .queue-card:hover {
      transform: translateY(-2px);
      border-color: #aecfc7;
      box-shadow: 0 14px 28px rgba(22, 46, 43, .09);
    }

    .queue-card.active {
      border-color: #64b9ad;
      background:
        linear-gradient(180deg, #ffffff 0%, #f4fbf8 100%);
      box-shadow: 0 16px 30px rgba(20, 120, 111, .13);
    }

    .rank {
      position: absolute;
      top: 8px;
      left: 8px;
      min-width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: rgba(255, 255, 255, .92);
      color: var(--teal-deep);
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(20, 39, 45, .08);
      z-index: 1;
    }

    .thumb {
      width: 78px;
      height: 98px;
      border-radius: 8px;
      background: #f4f6f2;
      border: 1px solid #dfe8e3;
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .thumb::before {
      content: "";
      position: absolute;
      inset: auto 8px 12px;
      height: 20px;
      border-radius: 50%;
      background: rgba(16, 30, 29, .09);
      filter: blur(2px);
      transform: skewX(-12deg);
      z-index: -1;
    }

    .thumb::after {
      content: "";
      position: absolute;
      inset: 0 0 auto auto;
      width: 30px;
      height: 100%;
      background: rgba(255, 255, 255, .34);
      clip-path: polygon(35% 0, 100% 0, 100% 100%, 0 100%);
      z-index: -1;
    }

    .pack {
      width: 48px;
      height: 62px;
      border-radius: 7px 7px 11px 11px;
      background: #fff;
      box-shadow: 0 12px 18px rgba(25, 42, 48, .16);
      border: 1px solid rgba(22,35,41,.08);
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
      transform: rotate(-2deg);
      position: relative;
    }

    .pack::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 9px;
      background: rgba(255, 255, 255, .18);
      pointer-events: none;
    }

    .pack b {
      display: grid;
      place-items: center;
      padding: 7px 4px 2px;
      font-size: 13px;
      line-height: 1.05;
      text-align: center;
      color: #fff;
    }

    .pack small {
      padding: 4px;
      text-align: center;
      color: var(--text);
      font-size: 10px;
      background: rgba(255, 255, 255, .84);
    }

    .beef.thumb,
    .beef.product-stage { background: linear-gradient(145deg, #f8f4ee 0%, #edf4ef 100%); }
    .egg.thumb,
    .egg.product-stage { background: linear-gradient(145deg, #fff8e9 0%, #edf5ef 100%); }
    .chicken.thumb,
    .chicken.product-stage { background: linear-gradient(145deg, #f2f0fb 0%, #eef4f2 100%); }
    .ball.thumb,
    .ball.product-stage { background: linear-gradient(145deg, #ecf6f7 0%, #f6f4ee 100%); }
    .rice.thumb,
    .rice.product-stage { background: linear-gradient(145deg, #edf8ef 0%, #f6f2e8 100%); }
    .beef .pack b { background: linear-gradient(180deg, #a43832 0%, #832a28 100%); }
    .egg .pack b { background: linear-gradient(180deg, #e09a22 0%, #c37812 100%); }
    .chicken .pack b { background: linear-gradient(180deg, #795bb7 0%, #5b438e 100%); }
    .ball .pack b { background: linear-gradient(180deg, #357789 0%, #245765 100%); }
    .rice .pack b { background: linear-gradient(180deg, #348b61 0%, #246b49 100%); }

    .card-main {
      min-width: 0;
      display: grid;
      gap: 7px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 760;
      color: var(--ink);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .tag {
      flex: 0 0 auto;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      color: var(--teal-deep);
      background: #def2ec;
      border: 1px solid #c6e5dd;
    }

    .tag.season {
      color: #8a5200;
      background: #fff2d7;
      border-color: #f1d7a7;
    }

    .tag.local {
      color: #1e5c95;
      background: var(--blue-soft);
      border-color: #cadcff;
    }

    .tag.conditional,
    .tag.explore {
      color: var(--orange);
      background: var(--orange-soft);
      border-color: #f3d4a9;
    }

    .reason {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .mini-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mini-fact {
      height: 24px;
      padding: 0 7px;
      border-radius: 7px;
      background: #f5f8f6;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      max-width: 100%;
    }

    .mini-fact strong {
      color: var(--text);
      font-weight: 700;
    }

    .risk {
      color: var(--orange);
      background: var(--orange-soft);
    }

    .feedback-row {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      padding-top: 2px;
    }

    .feedback-button {
      height: 28px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
    }

    .feedback-button:hover {
      transform: translateY(-1px);
      color: var(--teal-deep);
      border-color: #b9d8d3;
    }

    .feedback-button.good.selected {
      color: var(--green);
      background: var(--green-soft);
      border-color: #b8e2c7;
    }

    .feedback-button.bad.selected {
      color: var(--red);
      background: var(--red-soft);
      border-color: #f2c3bf;
    }

    .detail-stack {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 14px;
    }

    .detail-panel {
      min-height: 0;
      overflow: auto;
      padding: 16px 18px;
      background:
        linear-gradient(180deg, #ffffff 0%, #fbfdfb 100%);
    }

    .detail-hero {
      display: grid;
      grid-template-columns: 188px minmax(0, 1fr);
      gap: 18px;
      align-items: stretch;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line-soft);
    }

    .product-stage {
      min-height: 162px;
      border-radius: 8px;
      border: 1px solid #dfe8e3;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .product-stage::before,
    .product-stage::after {
      content: "";
      position: absolute;
      z-index: -1;
    }

    .product-stage::before {
      inset: 18px 18px auto auto;
      width: 56px;
      height: 126px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .45);
      transform: rotate(16deg);
    }

    .product-stage::after {
      inset: auto 24px 24px;
      height: 28px;
      border-radius: 50%;
      background: rgba(16, 30, 29, .12);
      filter: blur(4px);
    }

    .product-stage .pack {
      width: 80px;
      height: 106px;
      border-radius: 12px 12px 18px 18px;
      transform: rotate(-3deg);
    }

    .product-stage .pack b {
      font-size: 21px;
      padding: 14px 8px 5px;
    }

    .product-stage .pack small {
      font-size: 13px;
      padding: 7px;
    }

    .detail-copy {
      min-width: 0;
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .detail-meta span:not(.tag) {
      color: var(--muted);
      font-size: 13px;
    }

    .detail-copy h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1.18;
      font-weight: 820;
      letter-spacing: 0;
    }

    .verdict {
      margin: 0;
      color: var(--text);
      font-size: 15px;
      max-width: 70ch;
      line-height: 1.65;
    }

    .detail-facts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .fact-cell {
      min-height: 58px;
      border-radius: 8px;
      background: #f8fbfa;
      border: 1px solid #e1ebe7;
      padding: 9px 10px;
      display: grid;
      align-content: center;
      gap: 3px;
    }

    .fact-cell span {
      color: var(--muted);
      font-size: 12px;
    }

    .fact-cell strong {
      color: var(--ink);
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 14px 0 10px;
    }

    .section-tab {
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      color: var(--muted);
      background: #f8fbfa;
      border: 1px solid #e1ebe7;
      transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);

          state.tab = "why";
          renderAll();
          track("ai_selection_detail_open", { recommendation_result_id: state.selectedId });
        });
      });
      createIcons();
    }

    function renderDetail() {
      const item = getSelected();
      const section = item.sections[state.tab] || item.sections.why;
      dom.assistantContext.textContent = `正在看：${item.title}`;

      dom.detailPanel.innerHTML = `
        <div class="detail-hero">
          ${productVisual(item, true)}
          <div class="detail-copy">
            <div class="detail-meta">
              <span class="${tagClass(item)}">${item.tag}</span>
              <span>${item.category}</span>
            </div>
            <h2>${item.title}</h2>
            <p class="verdict">${item.verdict}</p>
            <div class="detail-facts">
              <div class="fact-cell"><span>适合人群</span><strong>${item.audience}</strong></div>
              <div class="fact-cell"><span>建议范围</span><strong>${item.scope}</strong></div>
              <div class="fact-cell"><span>建议价</span><strong>${item.price}</strong></div>
              <div class="fact-cell"><span>竞对价格</span><strong>${item.competitor}</strong></div>
            </div>
          </div>
        </div>

        <div class="section-tabs" role="tablist" aria-label="推荐详情分类">
          ${tabs.map(tab => `
            <button class="section-tab ${state.tab === tab.key ? "active" : ""}" type="button" data-tab="${tab.key}" role="tab" aria-selected="${state.tab === tab.key}">
              ${tab.label}
            </button>
          `).join("")}
        </div>

        <section class="decision-section">
          <div class="section-copy">
            <h3>${section.title}</h3>
            <p class="section-lead">${section.lead}</p>
            <ul class="evidence-list">
              ${section.points.map(point => `<li>${point}</li>`).join("")}
            </ul>
          </div>
          <aside class="next-step">
            <h3>下一步</h3>
            <p>${section.action}</p>
            <p class="warning">${section.warning}</p>
          </aside>
        </section>
      `;

      dom.detailPanel.querySelectorAll(".section-tab").forEach(button => {
        button.addEventListener("click", () => {
          state.tab = button.dataset.tab;
          renderDetail();
          track("ai_selection_detail_tab_click", { recommendation_result_id: state.selectedId, tab: state.tab });
        });
      });
      createIcons();
    }

    function renderAssistant() {
      const item = getSelected();
      dom.quickQuestions.innerHTML = questionLabels.map(question => `
        <button type="button" data-question="${question.key}">${question.label}</button>
      `).join("");
      dom.quickQuestions.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          const key = button.dataset.question;
          dom.assistantAnswer.textContent = item.answers[key];
          track("ai_selection_ai_quick_question", { recommendation_result_id: item.id, question: key });
        });
      });
    }

    function setFeedback(id, value) {
      state.feedback[id] = value;
      showToast(value === "good" ? "已记录：有帮助" : "已记录：没帮助");
      renderQueue();
      track(value === "good" ? "ai_selection_feedback_good_click" : "ai_selection_feedback_bad_click", {
        recommendation_result_id: id
      });
    }

    function showToast(text) {
      dom.toast.querySelector("span").textContent = text;
      dom.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => dom.toast.classList.remove("show"), 1600);
      createIcons();
    }

    function renderAll() {
      renderQueue();
      renderDetail();
      renderAssistant();
    }

    function showLoading() {
      dom.queueList.innerHTML = `
        <div class="loading-state">
          <div>
            <i data-lucide="loader-circle"></i>
            <strong>正在整理推荐新品</strong>
            <p>马上给你排好。</p>
          </div>
        </div>
      `;
      dom.detailPanel.innerHTML = `
        <div class="loading-state">
          <div>
            <i data-lucide="loader-circle"></i>
            <strong>正在打开单品档案</strong>
            <p>先把最值得看的放到右侧。</p>
          </div>
        </div>
      `;
      createIcons();
    }

    function handleQuery(event) {
      event.preventDefault();
      const major = dom.major.value;
      const middle = dom.middle.value;
      const leaf = dom.leaf.value;
      if (!major || !middle) {
        dom.note.classList.add("error");
        dom.note.innerHTML = '<i data-lucide="circle-alert"></i><span>先选大分类和中分类，再查询。</span>';
        createIcons();
        return;
      }

      dom.note.classList.remove("error");
      dom.note.innerHTML = '<i data-lucide="sparkles"></i><span>正在按你的条件整理推荐。</span>';
      showLoading();

      window.setTimeout(() => {
        const matched = recommendations.filter(item => {
          const majorMatch = item.major === major;
          const middleMatch = item.middle === middle;
          const leafMatch = !leaf || item.leaf === leaf;
          return majorMatch && middleMatch && leafMatch;
        });
        state.visibleIds = matched.length ? matched.map(item => item.id) : [];
        state.selectedId = state.visibleIds[0] || recommendations[0].id;
        state.tab = "why";
        dom.note.innerHTML = matched.length
          ? '<i data-lucide="sparkles"></i><span>已按推荐优先级排好，建议从第一条开始看。</span>'
          : '<i data-lucide="search-x"></i><span>当前条件下暂无推荐，可以换一个中分类再查。</span>';
        renderAll();
        track("ai_selection_query_click", { major, middle, leaf });
      }, 420);
    }

    function handleReset() {
      document.getElementById("region").value = "全部";
      document.getElementById("city").value = "上海";
      dom.major.value = "";
      renderCategoryOptions();
      state.visibleIds = [];
      dom.note.classList.remove("error");
      dom.note.innerHTML = '<i data-lucide="sparkles"></i><span>选择大分类和中分类后查询。</span>';
      dom.queueList.innerHTML = `
        <div class="empty-state">
          <div>
            <i data-lucide="list-filter"></i>
            <strong>先选择一个新品范围</strong>
            <p>选好大分类和中分类后，我会把推荐新品排好。</p>
          </div>
        </div>
      `;
      dom.detailPanel.innerHTML = `
        <div class="empty-state">
          <div>
            <i data-lucide="panel-right"></i>
            <strong>点开推荐后看详情</strong>
            <p>这里会展示推荐理由、适合人群、价格、风险和试点建议。</p>
          </div>
        </div>
      `;
      dom.quickQuestions.innerHTML = "";
      dom.assistantAnswer.textContent = "查到推荐后，可以继续问这条推荐有没有帮助，或者哪里还要补材料。";
      createIcons();
      track("ai_selection_reset_click", {});
    }

    function handleAsk(event) {
      event.preventDefault();
      const item = getSelected();
      const text = dom.askInput.value.trim();
      if (!text) {
        dom.assistantAnswer.textContent = "你可以直接问：这条适合哪些门店，或者风险要先补什么。";
        return;
      }
      if (text.includes("门店")) {
        dom.assistantAnswer.textContent = item.sections.pilot.action + " 先别铺太大，试点反馈好再扩大。";
      } else if (text.includes("风险") || text.includes("缺")) {
        dom.assistantAnswer.textContent = item.answers.risk;
      } else if (text.includes("价格") || text.includes("贵")) {
        dom.assistantAnswer.textContent = item.answers.price;
      } else {
        dom.assistantAnswer.textContent = item.answers.why;
      }
      dom.askInput.value = "";
      track("ai_selection_ai_custom_question", { recommendation_result_id: item.id, text });
    }

    function createIcons() {
      if (window.lucide) window.lucide.createIcons();
    }

    function track(eventName, payload) {
      window.demoEvents = window.demoEvents || [];
      window.demoEvents.push({
        eventName,
        payload,
        eventTime: new Date().toISOString()
      });
    }

    dom.major.addEventListener("change", () => {
      renderCategoryOptions();
      dom.note.classList.remove("error");
    });
    dom.middle.addEventListener("change", renderLeafOptions);
    dom.filterForm.addEventListener("submit", handleQuery);
    dom.resetBtn.addEventListener("click", handleReset);
    dom.askForm.addEventListener("submit", handleAsk);

    dom.major.value = "肉禽蛋";
    renderCategoryOptions();
    dom.middle.value = "牛肉制品";
    renderLeafOptions();
    dom.leaf.value = "";
    renderAll();
    track("ai_selection_page_view", {});
    createIcons();
  </script>
</body>
</html>
