<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" width="1800" height="1100">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { font-size: 42px; font-weight: 800; fill: #111827; }
    .subtitle { font-size: 20px; font-weight: 600; fill: #6b7280; }
    .h2 { font-size: 28px; font-weight: 800; fill: #111827; }
    .node-title { font-size: 21px; font-weight: 800; fill: #111827; }
    .body { font-size: 18px; fill: #4b5563; }
    .small { font-size: 16px; fill: #6b7280; }
    .tiny { font-size: 13px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="arrow-gray" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0, 11 4, 0 8" fill="#6b7280"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0, 11 4, 0 8" fill="#ef4444"/></marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0, 11 4, 0 8" fill="#2563eb"/></marker>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1800" height="1100" fill="#f6f8fb"/>
  <rect x="50" y="44" width="1700" height="1012" rx="24" fill="#ffffff" stroke="#dbe3ef" filter="url(#soft-shadow)"/>
  <text x="100" y="108" class="title">AI 选品：有无 Harness 的区别</text>
  <rect x="1110" y="76" width="540" height="48" rx="24" fill="#eef6ff" stroke="#bfdbfe"/>
  <text x="1380" y="107" text-anchor="middle" style="font-size:18px;font-weight:800;fill:#2563eb;">md 是说明书；Harness 是运行时程序逻辑</text>
  <rect x="100" y="195" width="760" height="650" rx="20" fill="#fff7f7" stroke="#fecaca" stroke-width="1.6"/>
  <rect x="940" y="195" width="760" height="650" rx="20" fill="#f7fbff" stroke="#bfdbfe" stroke-width="1.6"/>
  <rect x="100" y="195" width="760" height="78" rx="20" fill="#fee2e2"/>
  <rect x="940" y="195" width="760" height="78" rx="20" fill="#dbeafe"/>
  <text x="145" y="247" class="h2">没有 Harness：大模型自由发挥</text>
  <text x="985" y="247" class="h2">有 Harness：按采购流程办业务</text>
  <line x1="900" y1="195" x2="900" y2="845" stroke="#d1d5db" stroke-width="2.2" stroke-dasharray="9 9"/>
  <rect x="145" y="330" width="300" height="105" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="171" y="370" class="node-title">采购提问</text>
  <text x="171" y="400" class="small">上海牛肉类</text>
  <text x="171" y="427" class="small">有什么新品机会？</text>
  <rect x="515" y="330" width="300" height="105" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="541" y="370" class="node-title">大模型直接判断</text>
  <text x="541" y="400" class="small">自己理解问题</text>
  <text x="541" y="427" class="small">自己决定怎么查</text>
  <path d="M 460,383 L 500,383" fill="none" stroke="#ef4444" stroke-width="2.6" marker-end="url(#arrow-red)"/>
  <rect x="145" y="500" width="300" height="125" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="171" y="540" class="node-title">临时查数据</text>
  <text x="171" y="570" class="small">可能查错表</text>
  <text x="171" y="597" class="small">可能漏掉竞品证据</text>
  <text x="171" y="624" class="small">可能实时拼逻辑</text>
  <rect x="515" y="500" width="300" height="125" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="541" y="540" class="node-title">直接生成回答</text>
  <text x="541" y="570" class="small">每次问法不同</text>
  <text x="541" y="597" class="small">结果可能不一致</text>
  <path d="M 665,445 L 665,488" fill="none" stroke="#ef4444" stroke-width="2.6" marker-end="url(#arrow-red)"/>
  <path d="M 460,563 L 500,563" fill="none" stroke="#ef4444" stroke-width="2.6" marker-end="url(#arrow-red)"/>
  <rect x="145" y="640" width="670" height="196" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="1.6"/>
  <text x="180" y="684" style="font-size:24px;font-weight:800;fill:#be123c;">业务风险</text>
  <circle cx="182" cy="714" r="5" fill="#ef4444"/>
  <text x="204" y="720" class="small">不稳定：今天和明天可能查法不同</text>
  <circle cx="182" cy="744" r="5" fill="#ef4444"/>
  <text x="204" y="750" class="small">不好验收：不知道它到底查了什么</text>
  <circle cx="182" cy="774" r="5" fill="#ef4444"/>
  <text x="204" y="780" class="small">容易编造：没有返回的证据也可能说出来</text>
  <circle cx="182" cy="804" r="5" fill="#ef4444"/>
  <text x="204" y="810" class="small">难追溯：采购采纳后不好复盘原因</text>
  <rect x="985" y="315" width="250" height="105" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1011" y="355" class="node-title">采购提问</text>
  <text x="1011" y="385" class="small">上海牛肉类</text>
  <text x="1011" y="412" class="small">有什么新品机会？</text>
  <rect x="1295" y="298" width="360" height="150" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.3"/>
  <text x="1325" y="336" style="font-size:23px;font-weight:900;fill:#1d4ed8;">Agent Harness 调度台</text>
  <text x="1325" y="368" class="small">把自然语言变成可控流程</text>
  <rect x="1325" y="388" width="94" height="24" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1372" y="405" text-anchor="middle" style="font-size:13px;fill:#2563eb;font-weight:800;">意图识别</text>
  <rect x="1440" y="388" width="94" height="24" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1487" y="405" text-anchor="middle" style="font-size:13px;fill:#2563eb;font-weight:800;">参数抽取</text>
  <rect x="1555" y="388" width="94" height="24" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1602" y="405" text-anchor="middle" style="font-size:13px;fill:#2563eb;font-weight:800;">工具路由</text>
  <rect x="1325" y="418" width="94" height="24" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1372" y="435" text-anchor="middle" style="font-size:13px;fill:#2563eb;font-weight:800;">轻量重排</text>
  <rect x="1440" y="418" width="94" height="24" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1487" y="435" text-anchor="middle" style="font-size:13px;fill:#2563eb;font-weight:800;">证据校验</text>
  <rect x="1555" y="418" width="94" height="24" rx="7" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1602" y="435" text-anchor="middle" style="font-size:13px;fill:#2563eb;font-weight:800;">日志记录</text>
  <path d="M 1250,368 L 1280,368" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
  <rect x="985" y="500" width="250" height="105" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1011" y="540" class="node-title">后端 API</text>
  <text x="1011" y="570" class="small">search_opportunities</text>
  <text x="1011" y="597" class="small">get_detail / evidence</text>
  <rect x="1295" y="500" width="360" height="105" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1321" y="540" class="node-title">推荐表和证据表</text>
  <text x="1321" y="570" class="small">离线已经算好</text>
  <text x="1321" y="597" class="small">只读取，不实时重算</text>
  <path d="M 1475,458 L 1475,488" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
  <path d="M 1250,553 L 1280,553" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
  <rect x="985" y="675" width="250" height="105" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1011" y="715" class="node-title">大模型解释</text>
  <text x="1011" y="745" class="small">只解释返回结果</text>
  <text x="1011" y="772" class="small">不能自己编证据</text>
  <rect x="1295" y="675" width="360" height="105" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="1321" y="715" class="node-title">采购看到建议</text>
  <text x="1321" y="745" class="small">推荐方向 / 为什么</text>
  <text x="1321" y="772" class="small">价格区间 / 风险 / 试点建议</text>
  <path d="M 1475,615 L 1475,662" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
  <path d="M 1250,728 L 1280,728" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
  <rect x="985" y="795" width="670" height="34" rx="17" fill="#ecfdf5" stroke="#86efac"/>
  <text x="1320" y="819" text-anchor="middle" style="font-size:16px;font-weight:800;fill:#047857;">结果稳定、可追溯、可验收，业务知道系统查了什么</text>
  <rect x="100" y="890" width="1600" height="112" rx="18" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="145" y="932" style="font-size:25px;font-weight:900;fill:#111827;">给业务的一句话</text>
  <text x="145" y="967" class="body">没有 Harness，AI 更像一个问答 Demo；有 Harness，AI 才像一个按采购流程工作的数字员工。</text>
  <text x="145" y="996" class="body">md 文档只是写清楚规则的说明书，真正的 Harness 是后端 / Agent 服务里运行的一段程序逻辑。</text>
</svg>